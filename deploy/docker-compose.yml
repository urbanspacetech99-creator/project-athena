version: "3"

# Refer to .env.example for documentation of environment variables
x-app-env: &app_env
  # Core
  - DATABASE_URL=
  - TEST_DATABASE_URL=
  - FIXTURE_DATABASE_URL=
  - SOURCE_MODE=
  - LOG_LEVEL=
  - DB_AUTO_CREATE=
  - FRONTEND_DIST=
  # Per-source overrides (blank =
  - META_SOURCE_MODE=
  - GOOGLE_REVIEWS_SOURCE_MODE=
  - GOOGLE_ADS_SOURCE_MODE=
  - GOOGLE_PLACES_SOURCE_MODE=
  - ZOHO_SOURCE_MODE=
  # Feature flags
  - COMPETITOR_LIVE_ACCESS_ENABLED=
  # AI: text (Anthropic Claude)
  - CLAUDE_API_KEY=
  - CLAUDE_MODEL=
  - LLM_MODE=
  # AI: images (Google Gemini)
  - GEMINI_API_KEY=
  - GEMINI_IMAGE_MODEL=
  - IMAGE_MODE=
  # Canva Connect
  - CANVA_MODE=
  - CANVA_CLIENT_ID=
  - CANVA_CLIENT_SECRET=
  - CANVA_ACCESS_TOKEN=
  - CANVA_REFRESH_TOKEN=
  # Meta Graph
  - META_PAGE_ID=
  - META_PAGE_TOKEN=
  - META_IG_USER_ID=
  # Google (one OAuth client, one grant per source)
  - GOOGLE_OAUTH_CLIENT_ID=
  - GOOGLE_OAUTH_CLIENT_SECRET=
  - GOOGLE_REVIEWS_REFRESH_TOKEN=
  - GOOGLE_ADS_REFRESH_TOKEN=
  - GBP_ACCOUNT_ID=
  - GBP_LOCATION_ID=
  - GADS_DEVELOPER_TOKEN=
  - GADS_LOGIN_CUSTOMER_ID=
  - GADS_CUSTOMER_ID=
  - GOOGLE_PLACES_API_KEY=
  # Zoho CRM
  - ZOHO_CLIENT_ID=
  - ZOHO_CLIENT_SECRET=
  - ZOHO_REFRESH_TOKEN=
  - ZOHO_DC=
  - ZOHO_MODULE=
  - ZOHO_TRANSCRIPT_FIELD=

services:
  api:
    # Serves BOTH the REST API and the bundled marketing dashboard at "/".
    image: athena-backend:0.4.0
    container_name: athena-api
    hostname: athena-api
    command: uvicorn athena.api.app:app --host 0.0.0.0 --port 8000
    networks:
      - urbanspace_intra
    environment: *app_env
    expose:
      - "8000"
    restart: always

  worker:
    # Daily external API data pull to DB
    image: athena-backend:0.4.0
    container_name: athena-worker
    hostname: athena-worker
    command: python -m athena.worker.main
    networks:
      - urbanspace_intra
    environment: *app_env
    restart: always

  cloudflared:
    container_name: cloudflared
    hostname: cloudflared
    image: cloudflare/cloudflared:latest
    environment:
      - TUNNEL_TOKEN=
    command: tunnel --no-autoupdate run
    networks:
      - urbanspace_intra
    restart: unless-stopped

networks:
  urbanspace_intra:
    external:
      name: urbanspace_intra
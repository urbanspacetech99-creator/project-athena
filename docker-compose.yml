# Athena — LOCAL DEVELOPMENT stack only: builds the image from source, publishes
# ports on 127.0.0.1, and hot-reloads the dev console from a bind mount.
# The production stack is a separate, self-contained file: deploy/docker-compose.yml
# (prebuilt image, external urbanspace_intra network, expose-only). See deploy/README.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
      POSTGRES_DB: athena
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn athena.api.app:app --host 0.0.0.0 --port 8000
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://athena:athena@db:5432/athena
      # Override the .env fixture URL too: its host is unreachable on the compose
      # network, and bootstrap provisions this DB on the db service (mixed-mode routing).
      FIXTURE_DATABASE_URL: postgresql+psycopg://athena:athena@db:5432/athena_fixture
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build: .
    command: python -m athena.worker.main
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://athena:athena@db:5432/athena
      FIXTURE_DATABASE_URL: postgresql+psycopg://athena:athena@db:5432/athena_fixture
    depends_on:
      db:
        condition: service_healthy

  dev-console:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://api:8000
    volumes:
      - ./dev-console:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  pgdata:

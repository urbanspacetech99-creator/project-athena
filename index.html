<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Space — Marketing Agent</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="sb-toprow">
      <button class="sb-toggle" id="sbToggle" onclick="toggleSidebar()" title="Collapse sidebar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="sb-logo-row">
      <div class="sb-logo-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>
      </div>
      <div class="sb-logo-text">
        <div class="sb-logo-name"><b>URBAN<span style="font-weight:800">SPACE</span></b></div>
        <div class="sb-logo-sub">Self-Storage &middot; Work &middot; Fulfilment</div>
      </div>
    </div>
    <div class="sb-status"><span class="sb-status-dot"></span><span class="sb-status-txt">Marketing Agent</span></div>
    <div class="sb-nav">
      <button class="sb-item on" id="nav-home" onclick="go('home')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/></svg>
        <span>Home</span>
      </button>
      <button class="sb-item" id="nav-research" onclick="go('research')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        <span>Research</span>
      </button>
      <button class="sb-item" id="nav-generate" onclick="go('generate')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span>Generate</span>
      </button>
    </div>
    <div class="sb-spacer"></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>

<!-- Load order matters: assets/icons/mock-data before api, api before app -->
<script src="js/assets.js"></script>
<script src="js/icons.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>

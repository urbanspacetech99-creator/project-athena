<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Space — Marketing Agent</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <nav class="sb">
    <div><div class="logo-name">Urban Space</div><div class="logo-sub">Marketing Agent</div></div>
    <button class="nb on" id="nb-home" onclick="go('home')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/></svg>Home
    </button>
    <button class="nb" id="nb-research" onclick="go('research')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>Research
    </button>
    <button class="nb" id="nb-generate" onclick="go('generate')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M16.3 7.7l-2.1 2.1M7.8 16.2l-2.1 2.1"/><circle cx="12" cy="12" r="3"/></svg>Generate
    </button>
    <div class="sb-foot">
      <div class="sb-foot-lbl">AI agent</div>
      <div class="online-row"><span class="online-dot"></span><span style="font-size:12px;color:#4CD97B;font-weight:600">Online</span></div>
    </div>
  </nav>
  <main class="main" id="mc"></main>
</div>
<script src="app.js"></script>
</body>
</html>
